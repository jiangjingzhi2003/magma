services:
  # AFL++ with minimization
  afl-libsndfile-main:
    image: fuzz-libsndfile
    privileged: true
    container_name: "${COMPOSE_PROJECT_NAME:-default}-afl-libsndfile"
    environment:
      CORPUS_DIR: /corpus
      OUTPUT_DIR: /afl-output
      OUT: /out
      MINIMIZED_DIR: /corpus_min
      FUZZER_ID: master
      FUZZ_BIN: /out/sndfile_fuzzer
      FUZZ_TARGET: sndfile_fuzzer
    volumes:
      - ./corpus:/corpus:rw
      - output-volume:/afl-output:rw
      - ./out:/out:rw
      - ./corpus_min:/corpus_min:rw
    entrypoint: ["/entrypoint.sh", "minimize"]
    tty: true
    stdin_open: true
    restart: "no"
  # AFL++ without minimization
  afl-libsndfile-unmin:
    image: fuzz-libsndfile
    privileged: true
    container_name: "${COMPOSE_PROJECT_NAME:-default}-afl-libsndfile-unmin"
    environment:
      CORPUS_DIR: /corpus
      OUTPUT_DIR: /afl-output
      FUZZER_ID: master
    volumes:
      - ./corpus:/corpus:rw
      - unmin-output-volume:/afl-output:rw
    entrypoint: ["/entrypoint.sh"]
    tty: true
    stdin_open: true
    restart: "no"
volumes:
  # AFL output for minimized AFL run
  output-volume:
  # AFL output for unminimized AFL run
  unmin-output-volume:
  # Minimized corpus for minimized AFL run
  minimized-corpus-volume:
